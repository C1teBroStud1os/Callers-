<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caller Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f6f9; min-height: 100vh; padding: 1.5rem; color: #1a1a1a; }
  h1 { font-size: 22px; font-weight: 600; color: #1B3A5C; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
  .add-row { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .add-row input, .add-row select { font-size: 13px; padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #1a1a1a; }
  .add-row input { width: 180px; }
  .add-row select { flex: 1; min-width: 160px; }
  .btn { font-size: 13px; padding: 8px 16px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #1a1a1a; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f0f0f0; }
  .btn-primary { background: #1B3A5C; color: #fff; border-color: #1B3A5C; }
  .btn-primary:hover { background: #162f4a; }
  .btn-danger { border-color: #f09595; color: #a32d2d; font-size: 12px; }
  .btn-danger:hover { background: #fcebeb; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 1.5rem; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.1rem; }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .caller-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .area-badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; background: #ddeaf7; color: #0c447c; font-weight: 600; }
  .no-area { font-size: 11px; color: #aaa; }
  .area-select { width: 100%; font-size: 12px; padding: 6px 8px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #1a1a1a; margin-bottom: 10px; }
  .divider { height: 1px; background: #f0f0f0; margin: 10px 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat-box { background: #f8f9fb; border-radius: 8px; padding: 10px; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; color: #1B3A5C; }
  .stat-label { font-size: 11px; color: #888; margin-top: 2px; }
  .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .action-btn { padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.call { border-color: #185FA5; color: #185FA5; }
  .action-btn.call:hover { background: #e6f1fb; }
  .action-btn.meeting { border-color: #3B6D11; color: #3B6D11; }
  .action-btn.meeting:hover { background: #eaf3de; }
  .action-btn.undo { color: #aaa; font-size: 11px; font-weight: 400; }
  .action-btn.undo:hover { background: #f5f5f5; }
  .whatsapp-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #25D366; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .whatsapp-btn:hover { background: #1ebe5d; }
  .remove-btn { width: 100%; padding: 7px; border-radius: 8px; border: 1px solid #f09595; background: transparent; color: #a32d2d; cursor: pointer; font-size: 11px; }
  .remove-btn:hover { background: #fcebeb; }
  .summary { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .summary h4 { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .summary-stat { text-align: center; }
  .summary-num { font-size: 24px; font-weight: 700; color: #1B3A5C; }
  .summary-label { font-size: 11px; color: #888; }
  .conflict { background: #fcebeb; color: #791f1f; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; display: none; }
  .empty { color: #bbb; font-size: 13px; font-style: italic; padding: 1rem 0; }
  .flash { animation: flash 0.3s ease; }
  @keyframes flash { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

  /* Modal */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 1.5rem; width: 100%; max-width: 360px; margin: 1rem; }
  .modal h3 { font-size: 16px; font-weight: 600; color: #1B3A5C; margin-bottom: 4px; }
  .modal p { font-size: 12px; color: #888; margin-bottom: 1.1rem; }
  .modal label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 4px; margin-top: 10px; }
  .modal input, .modal textarea { width: 100%; font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #1a1a1a; }
  .modal textarea { resize: none; height: 70px; }
  .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 1.1rem; }
  .modal-cancel { padding: 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #888; cursor: pointer; font-size: 13px; }
  .modal-cancel:hover { background: #f5f5f5; }
  .modal-send { padding: 10px; border-radius: 8px; border: none; background: #25D366; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
  .modal-send:hover { background: #1ebe5d; }

  @media (max-width: 500px) {
    body { padding: 1rem; }
    .add-row input { width: 100%; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<h1>📋 Caller Tracker</h1>
<p class="subtitle">Website Redesign Co. — Caller Management</p>

<div class="add-row">
  <input type="text" id="new-name" placeholder="Caller name..." />
  <select id="new-area"><option value="">Assign area...</option></select>
  <button class="btn btn-primary" onclick="addCaller()">+ Add Caller</button>
  <button class="btn btn-danger" onclick="resetAll()">Reset All</button>
</div>

<div id="conflict" class="conflict"></div>
<div id="cards" class="grid"><p class="empty">No callers yet — add one above</p></div>

<div class="summary">
  <h4>Team Totals</h4>
  <div class="summary-grid">
    <div class="summary-stat"><div class="summary-num" id="t-callers">0</div><div class="summary-label">Callers</div></div>
    <div class="summary-stat"><div class="summary-num" id="t-calls">0</div><div class="summary-label">Total Calls</div></div>
    <div class="summary-stat"><div class="summary-num" id="t-meetings">0</div><div class="summary-label">Meetings</div></div>
    <div class="summary-stat"><div class="summary-num" id="t-areas">0</div><div class="summary-label">Areas Covered</div></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>📅 Request a Meeting</h3>
    <p>Fill in the client details and we'll send a WhatsApp message to the group.</p>
    <label>Client / Business Name</label>
    <input type="text" id="m-client" placeholder="e.g. John's Pizza" />
    <label>Client Phone Number</label>
    <input type="tel" id="m-phone" placeholder="e.g. 425-555-1234" />
    <label>Notes (optional)</label>
    <textarea id="m-notes" placeholder="e.g. Interested in full redesign, best time to call is afternoons..."></textarea>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-send" onclick="sendWhatsApp()">Send to WhatsApp 💬</button>
    </div>
  </div>
</div>

<script>
const CITIES = ["Arlington","Bothell","Edmonds","Everett","Gold Bar","Granite Falls","Index","Kenmore","Lake Stevens","Lynnwood","Marysville","Mill Creek","Monroe","Mountlake Terrace","Mukilteo","Shoreline","Snohomish","Stanwood","Sultan","Startup"];
const WA_GROUP = "https://chat.whatsapp.com/FvfDUAmwNwk12n7hvyy0Mh";

let callers = [];
let nextId = 1;
let activeCallerName = '';

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem('callerTracker') || '{}');
    callers = d.callers || [];
    nextId = d.nextId || 1;
  } catch(e) { callers = []; }
  render();
}

function saveData() {
  localStorage.setItem('callerTracker', JSON.stringify({ callers, nextId }));
}

function takenAreas(excludeId) {
  return callers.filter(c => c.id !== excludeId).map(c => c.area).filter(Boolean);
}

function fillAreaSelect(el, current, excludeId) {
  el.innerHTML = '<option value="">Assign area...</option>';
  CITIES.forEach(city => {
    if (!takenAreas(excludeId).includes(city) || city === current) {
      const o = document.createElement('option');
      o.value = city; o.textContent = city;
      if (city === current) o.selected = true;
      el.appendChild(o);
    }
  });
}

function render() {
  fillAreaSelect(document.getElementById('new-area'), '', -1);
  const grid = document.getElementById('cards');
  grid.innerHTML = '';
  if (!callers.length) {
    grid.innerHTML = '<p class="empty">No callers yet — add one above</p>';
  } else {
    callers.forEach(c => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div class="card-top">
          <span class="caller-name">${c.name}</span>
          ${c.area ? `<span class="area-badge">${c.area}</span>` : '<span class="no-area">No area</span>'}
        </div>
        <select class="area-select" id="as-${c.id}" onchange="changeArea(${c.id},this.value)"></select>
        <div class="stats">
          <div class="stat-box"><div class="stat-num" id="calls-${c.id}">${c.calls}</div><div class="stat-label">Calls Made</div></div>
          <div class="stat-box"><div class="stat-num" id="mtgs-${c.id}">${c.meetings}</div><div class="stat-label">Meetings Booked</div></div>
        </div>
        <div class="action-btns">
          <button class="action-btn call" onclick="log(${c.id},'calls')">📞 +1 Call</button>
          <button class="action-btn meeting" onclick="log(${c.id},'meetings')">📅 +1 Meeting</button>
          <button class="action-btn undo" onclick="undo(${c.id},'calls')">↩ Undo Call</button>
          <button class="action-btn undo" onclick="undo(${c.id},'meetings')">↩ Undo Meeting</button>
        </div>
        <button class="whatsapp-btn" onclick="openModal('${c.name}')">💬 Request Meeting via WhatsApp</button>
        <button class="remove-btn" onclick="removeCaller(${c.id})">🗑 Remove Caller</button>
      `;
      grid.appendChild(div);
      fillAreaSelect(document.getElementById(`as-${c.id}`), c.area, c.id);
    });
  }
  document.getElementById('t-callers').textContent = callers.length;
  document.getElementById('t-calls').textContent = callers.reduce((s,c)=>s+c.calls,0);
  document.getElementById('t-meetings').textContent = callers.reduce((s,c)=>s+c.meetings,0);
  document.getElementById('t-areas').textContent = callers.filter(c=>c.area).length;
}

function openModal(callerName) {
  activeCallerName = callerName;
  document.getElementById('m-client').value = '';
  document.getElementById('m-phone').value = '';
  document.getElementById('m-notes').value = '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function sendWhatsApp() {
  const client = document.getElementById('m-client').value.trim();
  const phone = document.getElementById('m-phone').value.trim();
  const notes = document.getElementById('m-notes').value.trim();
  if (!client || !phone) { alert('Please fill in the client name and phone number.'); return; }
  const msg = `🗓 *Meeting Request*\n\n*Caller:* ${activeCallerName}\n*Client:* ${client}\n*Phone:* ${phone}${notes ? `\n*Notes:* ${notes}` : ''}\n\nPlease reply to confirm availability.`;
  const encoded = encodeURIComponent(msg);
  closeModal();
  window.open(`https://wa.me/?text=${encoded}`, '_blank');
}

function addCaller() {
  const name = document.getElementById('new-name').value.trim();
  const area = document.getElementById('new-area').value;
  if (!name) return;
  if (area && takenAreas(-1).includes(area)) { showConflict(`"${area}" is already taken.`); return; }
  callers.push({ id: nextId++, name, area, calls: 0, meetings: 0 });
  document.getElementById('new-name').value = '';
  saveData(); render();
}

function changeArea(id, area) {
  if (area && takenAreas(id).includes(area)) { showConflict(`"${area}" is already taken.`); render(); return; }
  const c = callers.find(c=>c.id===id);
  if (c) { c.area = area; saveData(); render(); }
}

function log(id, type) {
  const c = callers.find(c=>c.id===id);
  if (c) {
    c[type]++;
    const el = document.getElementById(`${type==='calls'?'calls':'mtgs'}-${id}`);
    if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    saveData(); render();
  }
}

function undo(id, type) {
  const c = callers.find(c=>c.id===id);
  if (c && c[type] > 0) { c[type]--; saveData(); render(); }
}

function removeCaller(id) {
  if (!confirm('Remove this caller?')) return;
  callers = callers.filter(c=>c.id!==id);
  saveData(); render();
}

function resetAll() {
  if (!confirm('Reset everything? This cannot be undone.')) return;
  callers = []; nextId = 1;
  saveData(); render();
}

function showConflict(msg) {
  const el = document.getElementById('conflict');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(()=>el.style.display='none', 3000);
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

loadData();
</script>
</body>
</html>
